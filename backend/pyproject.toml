[project]
name = "sportai"
version = "0.1.0"
description = "Football analysis engine, selection engine and API"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "pydantic[email]>=2.7",
  "alembic>=1.13",
  "mcp>=2.2,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sportai*"]
