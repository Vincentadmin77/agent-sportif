# Site Analytrack : fichiers statiques + données publiées par le chef d'orchestre (data/*.json).
# Domaine à remplacer le jour J ; HTTPS par certbot --nginx -d <domaine>.
server {
    listen 80;
    server_name _;
    root /srv/analytrack/site;
    index index.html;
    gzip on; gzip_types application/json application/javascript text/css; gzip_min_length 1024;
    location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    # pas de liste de fichiers, pas de fichiers cachés
    autoindex off;
    location ~ /\. { deny all; }
}
